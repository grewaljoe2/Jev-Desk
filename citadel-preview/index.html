><style>.director{position:absolute;left:12px;right:12px;bottom:66px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:100;pointer-events:auto}.director button{position:relative;z-index:101;min-height:52px;min-width:86px;border:2px solid #75c6ff;border-radius:12px;background:#0c2b52;color:white;font:bold 15px system-ui;touch-action:manipulation;-webkit-appearance:none;cursor:pointer}.director span{background:#081b36eb;border-radius:9px;padding:12px 6px;text-align:center;flex:1;font-size:11px}.status{bottom:8px!important;padding:9px!important;z-index:3}.world{transition:transform 1.3s ease;transform-origin:50% 50%;pointer-events:none}.hud{pointer-events:none}</style><div class="director"><button id="pause" type="button" onclick="window.toggleDirector()">Ⅱ Pause</button><span id="counter">1 / 8 · Auto</span><button id="next" type="button" onclick="window.nextDirector()">Next →</button></div><script>(function(){const world=document.getElementById('world'),scene=document.getElementById('scene'),counter=document.getElementById('counter'),pause=document.getElementById('pause');const views=[['Overview',0,0,1],['Arcane',18,14,1.65],['Iron Sentinel',-18,14,1.65],['Stormbringer',21,-8,1.65],['Specter',-21,-8,1.65],['Trickster',12,-17,1.6],['Sovereign',-12,-17,1.6],['Command center',0,-5,1.45]];let i=0,playing=true;function render(){const v=views[i];world.style.transform='translate('+v[1]+'%,'+v[2]+'%) scale('+v[3]+')';scene.textContent='Camera: '+v[0];counter.textContent=(i+1)+' / 8 · '+(playing?'Auto':'Paused')}window.nextDirector=function(){i=(i+1)%views.length;render()};window.toggleDirector=function(){playing=!playing;pause.textContent=playing?'Ⅱ Pause':'▶ Play';render()};setInterval(function(){if(playing)window.nextDirector()},6500);render()})()</script></main><footer>Preview only · no trading · no network requests · not connected to production</footer></div><script>try{const scenes=['Patrol and training','Portal rendezvous','Command conferenc
