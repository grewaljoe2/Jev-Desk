name: Savip shadow lifecycle tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  isolated-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_savip_shadow_lifecycle_isolation.py' -v
      - run: python -m unittest discover -s tests -p 'test_solana_owner_coverage.py' -v
      - run: python -m unittest discover -s tests -p 'test_solana_mock_collector.py' -v
      - run: python -m unittest discover -s tests -p 'test_savip_jev_ticket_evidence.py' -v
      - run: python -m unittest discover -s tests -p 'test_savip_single_survivor.py' -v
      - run: python -m unittest discover -s tests -p 'test_savip_single_eligibility.py' -v
      - run: python -m unittest discover -s tests -p 'test_savip_single_provider.py' -v
      - run: python -m unittest discover -s tests -p 'test_savip_single_audit.py' -v
      - run: python -m unittest discover -s tests -p 'test_savip_single_storage.py' -v
      - run: python -m unittest discover -s tests -p 'test_savip_single_worker_audit.py' -v
      - run: python -m unittest discover -s tests -p 'test_savip_single_shadow_bridge.py' -v
      - run: python -m unittest discover -s tests -p 'test_solana_account_not_owner.py' -v
      - run: python -m unittest discover -s tests -p 'test_solana_chain_boundary.py' -v
      - run: python -m unittest discover -s tests -p 'test_solana_chain_evidence_gate.py' -v
      - run: python -m unittest discover -s tests -p 'test_solana_account_lower_bound.py' -v
      - run: python -m unittest discover -s tests -p 'test_solana_pending_diagnostics.py' -v
      - run: python -m unittest discover -s tests -p 'test_solana_rpc_owner_decoder.py' -v
      - run: python -m unittest discover -s tests -p 'test_solana_owner_probe.py' -v
      - name: TEMP read-only mint identity check
        run: |
          python - <<'PY'
          import asyncio,json,httpx
          mint="2JxdiEFs3K8tVtWp4Q3SK6RGNwLJaRRNmX63y3Xnpump"
          async def main():
              async with httpx.AsyncClient(timeout=12) as client:
                  for method,params in (
                      ("getAccountInfo",[mint,{"encoding":"base64","commitment":"confirmed"}]),
                      ("getTokenSupply",[mint,{"commitment":"confirmed"}]),
                  ):
                      try:
                          resp=await client.post("https://api.mainnet-beta.solana.com",json={"jsonrpc":"2.0","id":1,"method":method,"params":params})
                          data=resp.json()
                          result=data.get("result") or {}
                          value=result.get("value")
                          output={"method":method,"http_status":resp.status_code,"rpc_error":data.get("error")}
                          if method=="getAccountInfo":
                              output["exists"]=value is not None
                              output["program"]=value.get("owner") if isinstance(value,dict) else None
                          else:
                              output["amount"]=value.get("amount") if isinstance(value,dict) else None
                              output["decimals"]=value.get("decimals") if isinstance(value,dict) else None
                          print("MINT_CHECK="+json.dumps(output,sort_keys=True),flush=True)
                      except (httpx.HTTPError,ValueError) as exc:
                          print("MINT_CHECK="+json.dumps({"method":method,"error":type(exc).__name__}),flush=True)
          asyncio.run(main())
          PY
