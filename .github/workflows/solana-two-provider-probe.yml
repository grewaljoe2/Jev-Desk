name: Solana two-provider research probe
on:
  pull_request:
    paths:
      - 'scripts/solana_two_provider_probe.py'
      - '.github/workflows/solana-two-provider-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx
      - run: python -m scripts.solana_two_provider_probe
