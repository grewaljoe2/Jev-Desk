name: Solana owner evidence tests
on:
  push:
    branches: [research/solana-owner-snapshot-proof]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run Solana regression tests against checked-out source
        run: python -m unittest discover -s tests -p 'test_solana_*.py' -v

