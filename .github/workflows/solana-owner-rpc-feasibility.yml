name: Solana owner RPC feasibility (manual only)
on:
  workflow_dispatch:
    inputs:
      mint:
        description: Solana mint public key
        required: true
        type: string
      token_program:
        description: SPL token program address
        required: true
        type: choice
        options:
          - TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
          - TokenzQdBNbLqP5VEhdkAS6EPFzDzzMbaK6r3nW4u
jobs:
  one-shot-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx
      - name: Single bounded public RPC request
        env:
          SOLANA_MINT: ${{ inputs.mint }}
          SOLANA_TOKEN_PROGRAM: ${{ inputs.token_program }}
        run: |
          python - <<'PY'
          import asyncio, json, os
          from app.research.solana_owner_probe import probe_owner_accounts
          result=asyncio.run(probe_owner_accounts(
              os.environ["SOLANA_MINT"], os.environ["SOLANA_TOKEN_PROGRAM"],
              timeout_seconds=12, max_bytes=2_000_000, max_accounts=5000))
          print(json.dumps(result, sort_keys=True))
          assert result.get("owner_coverage_complete") is False
          PY
